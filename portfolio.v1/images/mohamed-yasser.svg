<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="250" y1="0" x2="250" y2="600"/>
    <line x1="350" y1="0" x2="350" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="0" y1="500" x2="500" y2="500"/>
  </g>

  <!-- Glowing Aura Circle behind head -->
  <circle cx="250" cy="220" r="140" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="220" r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Developer Silhouette / Avatar Figure -->
  <!-- Shoulders & Body -->
  <path d="M 120 540 C 120 420, 160 380, 250 380 C 340 380, 380 420, 380 540 Z" fill="url(#avatarGrad)"/>
  <!-- Collar / Shirt Accent -->
  <path d="M 220 380 L 250 440 L 280 380 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M 250 440 L 250 540" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

  <!-- Head & Hair -->
  <circle cx="250" cy="230" r="75" fill="url(#avatarGrad)"/>
  
  <!-- Modern Geometric Glasses / Tech Accents -->
  <rect x="200" y="210" width="38" height="26" rx="6" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <rect x="262" y="210" width="38" height="26" rx="6" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <line x1="238" y1="223" x2="262" y2="223" stroke="#38bdf8" stroke-width="3"/>
  <line x1="185" y1="223" x2="200" y2="223" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="300" y1="223" x2="315" y2="223" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Initials Badge / Monogram -->
  <g transform="translate(250, 480)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" fill="#f8fafc" font-family="'Cairo', sans-serif" font-weight="700" font-size="16">محمد ياسر</text>
  </g>

  <!-- Digital Nodes Floating in background -->
  <circle cx="90" cy="140" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="410" cy="160" r="5" fill="#38bdf8" opacity="0.8"/>
  <line x1="410" y1="160" x2="430" y2="200" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  <circle cx="430" cy="200" r="3" fill="#38bdf8" opacity="0.5"/>
  <circle cx="80" cy="320" r="3" fill="#38bdf8" opacity="0.6"/>

  <!-- Corner Border Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 480 50 L 480 20 L 450 20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 20 550 L 20 580 L 50 580" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M 480 550 L 480 580 L 450 580" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
</svg>
